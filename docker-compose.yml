services:
  mqtt-client:
    container_name: quantum_mqtt_${ENV}
    build: .
    environment:
      ENV: ${ENV:-prod}
      MQTT_BROKER: ${MQTT_BROKER:-eu1.cloud.thethings.network}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_TOPIC: ${MQTT_TOPIC:-v3/climateguard@ttn/devices/+/up}
      MQTT_USERNAME: ${MQTT_USERNAME:-climateguard@ttn}
      TTN_API_KEY: ${TTN_API_KEY:?TTN_API_KEY is required}
      CLIMATEGUARD_TEST_MH_HOST: ${CLIMATEGUARD_TEST_MH_HOST:-hsma-iot.de}
      CLIMATEGUARD_TEST_MH_PORT: ${CLIMATEGUARD_TEST_MH_PORT:-8883}
      CLIMATEGUARD_TEST_MH_TOPIC: ${CLIMATEGUARD_TEST_MH_TOPIC:-climateguard/#}
      CLIMATEGUARD_TEST_MH_USERNAME: ${CLIMATEGUARD_TEST_MH_USERNAME:?CLIMATEGUARD_TEST_MH_USERNAME is required}
      CLIMATEGUARD_TEST_MH_PASSWORD: ${CLIMATEGUARD_TEST_MH_PASSWORD:?CLIMATEGUARD_TEST_MH_PASSWORD is required}
      QUANTUM_API_KEY: ${QUANTUM_API_KEY:-}
      QUANTUM_API_ENDPOINT: ${QUANTUM_API_ENDPOINT:-}
      QUANTUM_WRITE_ENABLED: ${QUANTUM_WRITE_ENABLED:-false}
    command: ["python", "app/main.py"]
    restart: unless-stopped
